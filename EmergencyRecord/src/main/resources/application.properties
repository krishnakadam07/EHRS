# --- JWT Configuration ---
jwt.secret=${JWT_SECRET:cGVyc29ubmVsLXdvcmtmbG93LWxlYXZlLW1hbmFnZW1lbnQtc3lzdGVtLXNlY3JldC1rZXktMjAyNg==}
