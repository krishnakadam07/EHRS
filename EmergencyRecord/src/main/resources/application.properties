spring.application.name=EmergencyRecord

# Runs on 8081 locally
server.port=${PORT:8081}

# --- Database Configuration (Strictly reads from .env) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- JWT Configuration ---
jwt.secret=${JWT_SECRET:cGVyc29ubmVsLXdvcmtmbG93LWxlYXZlLW1hbmFnZW1lbnQtc3lzdGVtLXNlY3JldC1rZXktMjAyNg==}
jwt.expiration-ms=86400000

# --- AWS S3 Configuration (Reads from .env) ---
aws.s3.bucket.name=${AWS_S3_BUCKET}
aws.s3.region=${AWS_REGION}
aws.s3.access.key=${AWS_ACCESS_KEY}
aws.s3.secret.key=${AWS_SECRET_KEY}

# --- Gmail SMTP Configuration (Reads from .env) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 🌟 --- Spring AI Configuration for Gemini Pro (Reads from .env) ---
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.options.model=gemini-3.5-flash
spring.ai.openai.chat.options.temperature=0.2

# 🌟 --- Twilio SMS Configuration (Reads from .env) ---
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER}