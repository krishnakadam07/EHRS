spring.application.name=EmergencyRecord

# 🌟 Dynamically uses Railway's port in production, falls back to 8081 locally
server.port=${PORT:8081}

# --- Database Configuration ---
# Uses your .env DB_URL, but falls back to Railway Cloud MySQL in production!
